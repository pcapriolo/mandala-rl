[phases.setup]
nixPkgs = ["python310", "python310Packages.pip"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["pip install -e ."]

[start]
cmd = "python scripts/play_vs_ai_web.py --port $PORT --host 0.0.0.0 --simulations 200"
