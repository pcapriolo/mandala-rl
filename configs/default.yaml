# Mandala RL Training Configuration

# Network Architecture
network:
  input_channels: 83
  num_actions: 30  # 12 BUILD_MOUNTAIN + 12 GROW_FIELD + 6 DISCARD
  num_res_blocks: 8
  channels: 96

# MCTS Parameters
mcts:
  num_simulations: 1600
  c_puct: 1.0
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

# Self-Play Parameters
selfplay:
  games_per_iteration: 100
  parallel_games: 32  # Simultaneous games for batched NN inference
  leaves_per_game: 4  # Virtual loss: collect N leaves per game per MCTS step (bigger GPU batches)
  temperature: 1.0
  temperature_threshold: 30  # Switch to deterministic play after this move

# Training Parameters
training:
  num_iterations: 1000
  batch_size: 256
  epochs_per_iteration: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_milestones: [50, 150, 300]
  lr_gamma: 0.3
  replay_buffer_size: 100000
  checkpoint_frequency: 1  # Save checkpoint every N iterations
  checkpoint_every_n_games: 10  # Save checkpoint every N games within iteration (for resume)

# Evaluation Parameters
evaluation:
  num_games: 100
  win_threshold: 0.55  # Win rate threshold to consider improvement
  eval_frequency: 1  # Evaluate every N iterations (async on CPU, never blocks training)
  eval_num_games: 20  # Games to play during training evaluation (fewer for speed)
  eval_mcts_simulations: 800  # MCTS sims for evaluation (match old self-play quality)
  eval_start_iteration: 1   # Fresh start — evaluate from the beginning

# Paths
paths:
  checkpoint_dir: data/checkpoints
  replay_dir: data/replays
  log_dir: data/logs
  elo_file: data/elo_ratings.json

# Deploy
deploy_frequency: 25  # Auto-export lightweight checkpoint to data/deploy/ every N iterations

# Hardware
device: auto  # auto-detects: cuda > mps > cpu (or set explicitly: cuda/mps/cpu)

# Replay saving
save_replay_frequency: 1  # Save every game (1 = all, 10 = every 10th)

# Reproducibility
seed: 42
