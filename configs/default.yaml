# Mandala RL Training Configuration

# Network Architecture
network:
  input_channels: 50
  num_actions: 30  # 12 BUILD_MOUNTAIN + 12 GROW_FIELD + 6 DISCARD
  num_res_blocks: 8
  channels: 96

# MCTS Parameters
mcts:
  num_simulations: 800
  c_puct: 1.0
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

# Self-Play Parameters
selfplay:
  games_per_iteration: 100
  temperature: 1.0
  temperature_threshold: 30  # Switch to deterministic play after this move

# Training Parameters
training:
  num_iterations: 1000
  batch_size: 256
  epochs_per_iteration: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_milestones: [100, 200, 300, 500, 700]
  lr_gamma: 0.1
  replay_buffer_size: 500000
  checkpoint_frequency: 1  # Save checkpoint every N iterations

# Evaluation Parameters
evaluation:
  num_games: 100
  win_threshold: 0.55  # Win rate threshold to consider improvement
  eval_frequency: 1  # Evaluate every N iterations (1 = every iteration)
  eval_num_games: 20  # Games to play during training evaluation (fewer for speed)
  eval_mcts_simulations: 400  # MCTS sims for evaluation (fewer for speed)

# Paths
paths:
  checkpoint_dir: data/checkpoints
  replay_dir: data/replays
  log_dir: data/logs
  elo_file: data/elo_ratings.json

# Hardware
device: mps  # Use 'mps' for Apple Silicon, 'cuda' for NVIDIA GPU, 'cpu' for CPU

# Replay saving
save_replay_frequency: 1  # Save every game (1 = all, 10 = every 10th)

# Reproducibility
seed: 42
