# network
input_channels: 280
num_actions: 131
num_res_blocks: 10
channels: 128
belief_size: 31
phase_aware_policy: false
factored_policy: false

# mcts
mcts_simulations: 800
c_puct: 1.5
dirichlet_alpha: 0.15
dirichlet_epsilon: 0.15
action_explore_boost: 0.0
action_buy_force_rate: 0.0
action_play_force_rate: 0.0
mcts_leaf_eval_source: score

# self-play
games_per_iteration: 100
parallel_games: 256
leaves_per_game: 8
temperature: 1.0
temperature_threshold: 25
explore_epsilon: 0.0
opponent_diversity_ratio: 0.2
opponent_iter_min: 6020
opponent_iter_max: 6020

# training
num_iterations: 3000
batch_size: 256
epochs_per_iteration: 1
learning_rate: 2.7e-6
weight_decay: 0.0001
lr_milestones: []
lr_gamma: 0.3
replay_buffer_size: 100000
min_buffer_for_training: 10000
checkpoint_frequency: 5
checkpoint_every_n_games: 0
entropy_weight: 0.03
policy_weight: 1.0
max_discard_rate: 0.0
seed_reinject_frequency: 0
min_play_rate: 0.0
prune_old_checkpoints: true

# evaluation
num_games: 100
win_threshold: 0.55
eval_frequency: 5
eval_num_games: 20
eval_mcts_simulations: 400
eval_start_iteration: 1

# paths
checkpoint_dir: /workspace/dominion_data/checkpoints
replay_dir: /workspace/dominion_data/replays
log_dir: /workspace/dominion_data/logs
elo_file: /workspace/dominion_data/elo_ratings.json

# curriculum
disabled_basic_supply: [0, 6, 16]
opponent_disabled_supply: [0, 3, 4, 6, 16, 21]
province_supply: 8
max_action_cards: 1
forced_kingdom_cards: [21]
big_money_force_rate: 0.0
draw_penalty: 0.0
drop_draws: true
max_turns: 50
early_terminate_decided: true

# misc
device: auto
seed: 42
save_replay_frequency: 1
deploy_frequency: 25
