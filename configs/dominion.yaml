# Dominion RL Training Configuration

# Network Architecture
network:
  input_channels: 280  # 218 base + 62 buy history channels (31 my buys + 31 opp buys)
  num_actions: 131  # 3 phase-end + 31*4 card actions + MOAT/DECLINE/ACCEPT/DECLINE
  num_res_blocks: 10
  channels: 128
  belief_size: 31
  phase_aware_policy: false  # Not yet trained — checkpoint uses simple fc_policy head
  factored_policy: false     # Not yet trained — checkpoint uses simple fc_policy head

# MCTS Parameters
mcts:
  num_simulations: 800
  c_puct: 1.5
  dirichlet_alpha: 0.15    # Lower for large action space (131 actions)
  dirichlet_epsilon: 0.50
  action_explore_boost: 0.0
  action_buy_force_rate: 0.0
  action_play_force_rate: 0.0

# Self-Play Parameters
selfplay:
  games_per_iteration: 100
  parallel_games: 256
  leaves_per_game: 8
  temperature: 1.0
  temperature_threshold: 25  # DEVLOG #149: reverted from 15 — lower threshold amplified bad policy
  explore_epsilon: 0.0        # DEVLOG #92 rule: must stay at 0.0 — crutch prevents organic learning
  opponent_diversity_ratio: 0.0  # Pure self-play for Phase 0 (DEVLOG #144)
  opponent_iter_min: 779  # Unused while diversity=0.0
  opponent_iter_max: 796  # Unused while diversity=0.0


# Training Parameters
training:
  num_iterations: 3000
  batch_size: 256
  epochs_per_iteration: 1
  learning_rate: 0.0000027   # 2.7e-5 — explicit current LR after passing all milestones through iter 2500. No schedule.
  weight_decay: 0.0001
  lr_milestones: []           # no scheduled LR drops — every LR change is an explicit config edit
  lr_gamma: 0.3               # inert without milestones; kept for code compatibility
  replay_buffer_size: 100000  # 218-ch tensors are large; saved to /workspace (100GB) which has plenty of room
  min_buffer_for_training: 10000  # Skip training until buffer has enough diversity (prevents overfit on tiny buffer)
  checkpoint_frequency: 25
  checkpoint_every_n_games: 0  # Disabled — was filling /workspace (50MB × 5/iter)
  entropy_weight: 0.03        # DEVLOG #145: 0.15 was too high, fought policy sharpening
  policy_weight: 1.0          # DEVLOG #145: fixed, no decay

# Evaluation Parameters
evaluation:
  num_games: 100
  win_threshold: 0.55
  eval_frequency: 5
  eval_num_games: 20
  eval_mcts_simulations: 400
  eval_start_iteration: 1

# Paths
paths:
  checkpoint_dir: /workspace/dominion_data/checkpoints
  replay_dir: /workspace/dominion_data/replays
  log_dir: /workspace/dominion_data/logs
  elo_file: /workspace/dominion_data/elo_ratings.json

# Deploy
deploy_frequency: 25

# Hardware
device: auto

# Replay saving
save_replay_frequency: 1

# Curriculum Learning — Phase 4: Silver/Gold/Province + Copper/Estate/Duchy re-enabled, supply=7
# See docs/plans/dominion-training-plan.md for full curriculum
disabled_basic_supply: [6, 16]  # Curse(6), Gardens(16) DISABLED. Copper/Estate/Duchy re-enabled at Phase 4 (DEVLOG #159). Curse/Gardens held — no natural buyer without attack/engine cards.
province_supply: 7  # Phase 4: card-set change only, supply unchanged from Phase 3. Gates: avg_prov ≥ 3.45, avg_turns < 30, draw_rate < 0.05, avg_estates < 0.1, avg_copper < 0.1 — all must hold 20 consec iters before Phase 5 (Smithy).
max_action_cards: 0
forced_kingdom_cards: []
big_money_force_rate: 0.0
draw_penalty: 0.0   # DEVLOG #148: removed — symmetric penalty destabilized training (draw% 3→55%)
drop_draws: true    # Draws carry zero differential signal in symmetric self-play — exclude their trajectories from the replay buffer entirely
max_turns: 50       # Headroom for supply=5 (expect ~22-30 turns per game)

# Reproducibility
seed: 42
