# Dominion RL Training Configuration

# Network Architecture
network:
  input_channels: 280  # 218 base + 62 buy history channels (31 my buys + 31 opp buys)
  num_actions: 131  # 3 phase-end + 31*4 card actions + MOAT/DECLINE/ACCEPT/DECLINE
  num_res_blocks: 10
  channels: 128
  belief_size: 31
  phase_aware_policy: true   # Route policy through phase-specific sub-heads
  factored_policy: true      # Decompose policy into control + type + card logits

# MCTS Parameters
mcts:
  num_simulations: 800
  c_puct: 1.5
  dirichlet_alpha: 0.15    # Lower for large action space (131 actions)
  dirichlet_epsilon: 0.50
  action_explore_boost: 0.0
  action_buy_force_rate: 0.0
  action_play_force_rate: 0.0

# Self-Play Parameters
selfplay:
  games_per_iteration: 100
  parallel_games: 256
  leaves_per_game: 8
  temperature: 1.0
  temperature_threshold: 10  # Follow prior sooner → Province depletion → decisive games
  explore_epsilon: 0.3        # 30% random action after threshold — breaks symmetric mirror play
  opponent_diversity_ratio: 0.7  # DEVLOG #114: 70% vs healthy VP-buying opponents to break Province-race equilibrium
  opponent_iter_min: 779  # DEVLOG #122: lock to pre-restart healthy Phase1 opponents only
  opponent_iter_max: 796  # DEVLOG #122: exclude degraded iters 797-800 from opponent pool


# Training Parameters
training:
  num_iterations: 3000
  batch_size: 256
  epochs_per_iteration: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_milestones: [500, 1500, 2500]
  lr_gamma: 0.3
  replay_buffer_size: 100000  # 218-ch tensors are large; saved to /workspace (100GB) which has plenty of room
  min_buffer_for_training: 10000  # Skip training until buffer has enough diversity (prevents overfit on tiny buffer)
  checkpoint_frequency: 1
  checkpoint_every_n_games: 0  # Disabled — was filling /workspace (50MB × 5/iter)
  entropy_weight: 0.15        # Higher for fresh training — encourages exploration of buy space
  policy_weight: 3.0          # Start 3x, decays to 1.0 over 256 iters

# Evaluation Parameters
evaluation:
  num_games: 100
  win_threshold: 0.55
  eval_frequency: 5
  eval_num_games: 20
  eval_mcts_simulations: 400
  eval_start_iteration: 1

# Paths
paths:
  checkpoint_dir: /workspace/dominion_data/checkpoints
  replay_dir: /workspace/dominion_data/replays
  log_dir: /workspace/dominion_data/logs
  elo_file: /workspace/dominion_data/elo_ratings.json

# Deploy
deploy_frequency: 25

# Hardware
device: auto

# Replay saving
save_replay_frequency: 1

# Curriculum Learning — Phase 0: Silver/Gold/Province ONLY
# !! DO NOT CHANGE THIS WITHOUT CEO APPROVAL — see DEVLOG #122+ for Phase reversion incidents !!
disabled_basic_supply: [0, 3, 6, 16]  # Phase 0+Duchy: Copper(0), Estate(3), Curse(6), Gardens(16) DISABLED
province_supply: 3  # Low count = depletes fast, forces decisive games (Stage 1 curriculum)
max_action_cards: 0                   # No action cards in kingdom
forced_kingdom_cards: []              # Random (but 0 action cards = Gardens only, if any)
big_money_force_rate: 0.0

# Reproducibility
seed: 42
