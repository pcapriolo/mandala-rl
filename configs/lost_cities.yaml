# Lost Cities RL Training Configuration

# Network Architecture
network:
  input_channels: 126
  num_actions: 96  # 8 hand_pos * 2 dest * 6 draw_src
  num_res_blocks: 8
  channels: 96

# MCTS Parameters
mcts:
  num_simulations: 400  # 400 sims plenty for 96-action space; CPU MCTS is bottleneck
  c_puct: 1.0            # Trust improving policy more, explore less
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25 # Reduced from 0.35 — less noise, more signal

# Self-Play Parameters
selfplay:
  games_per_iteration: 100
  parallel_games: 128  # Simultaneous games for batched NN inference
  leaves_per_game: 8  # Virtual loss: collect N leaves per game per MCTS step (bigger GPU batches)
  temperature: 1.0
  temperature_threshold: 15  # Reduced from 30 — half the game was random, now deterministic after move 15

# Training Parameters
training:
  num_iterations: 2000
  batch_size: 256
  epochs_per_iteration: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_milestones: [400, 1500, 2200]  # Warm restart: LR jumps from 0.000027 → 0.0003 at resume
  lr_gamma: 0.3
  replay_buffer_size: 100000  # 100K — buffer no longer saved in checkpoint, rebuilds from self-play
  checkpoint_frequency: 1
  checkpoint_every_n_games: 10
  entropy_weight: 0.15  # Strong anti-collapse pressure — give belief/value heads time to learn
  policy_weight: 3.0    # Start 3x, decays to 1.0 over 256 iters — let auxiliary heads lead early

# Evaluation Parameters
evaluation:
  num_games: 100
  win_threshold: 0.55
  eval_frequency: 1
  eval_num_games: 20
  eval_mcts_simulations: 800
  eval_start_iteration: 219   # Start from first ISMCTS iteration

# Paths (separate from Mandala)
paths:
  checkpoint_dir: data/lost_cities/checkpoints
  replay_dir: data/lost_cities/replays
  log_dir: data/lost_cities/logs
  elo_file: data/lost_cities/elo_ratings.json

# Deploy
deploy_frequency: 25  # Auto-export lightweight checkpoint to data/deploy/ every N iterations

# Hardware
device: auto  # auto-detects: cuda > mps > cpu

# Replay saving
save_replay_frequency: 1

# Reproducibility
seed: 42
