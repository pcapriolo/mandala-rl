# Lost Cities RL Training Configuration

# Network Architecture
network:
  input_channels: 86
  num_actions: 96  # 8 hand_pos * 2 dest * 6 draw_src
  num_res_blocks: 8
  channels: 96

# MCTS Parameters
mcts:
  num_simulations: 800  # Reduced from 1600 — ISMCTS wastes zero sims, so 800 effective > 1600 wasteful
  c_puct: 1.5            # Increased from 1.0 — more MCTS exploration to break degenerate equilibrium
  dirichlet_alpha: 0.3   # Increased from 0.15 — more uniform noise for broader exploration
  dirichlet_epsilon: 0.35 # Increased from 0.25 — stronger noise influence at root

# Self-Play Parameters
selfplay:
  games_per_iteration: 100
  parallel_games: 32  # Simultaneous games for batched NN inference
  leaves_per_game: 4  # Virtual loss: collect N leaves per game per MCTS step (bigger GPU batches)
  temperature: 1.0
  temperature_threshold: 30  # Increased from 15 — explore longer to break degenerate strategy

# Training Parameters
training:
  num_iterations: 1000
  batch_size: 256
  epochs_per_iteration: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_milestones: [150, 400, 800]  # Extended from [50, 150, 300] — more budget at high LR
  lr_gamma: 0.3
  replay_buffer_size: 50000  # Reduced from 100000 — fresher data, less stale targets
  checkpoint_frequency: 1
  checkpoint_every_n_games: 10
  entropy_weight: 0.05  # Entropy regularization to prevent policy collapse (bumped from 0.02)

# Evaluation Parameters
evaluation:
  num_games: 100
  win_threshold: 0.55
  eval_frequency: 1
  eval_num_games: 20
  eval_mcts_simulations: 800
  eval_start_iteration: 219   # Start from first ISMCTS iteration

# Paths (separate from Mandala)
paths:
  checkpoint_dir: data/lost_cities/checkpoints
  replay_dir: data/lost_cities/replays
  log_dir: data/lost_cities/logs
  elo_file: data/lost_cities/elo_ratings.json

# Deploy
deploy_frequency: 25  # Auto-export lightweight checkpoint to data/deploy/ every N iterations

# Hardware
device: auto  # auto-detects: cuda > mps > cpu

# Replay saving
save_replay_frequency: 1

# Reproducibility
seed: 42
