<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Replay Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .iterations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .iter-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }
        .iter-card:hover { transform: scale(1.05); }
        .iter-name { font-size: 1.5em; font-weight: bold; }
        .iter-stats { margin-top: 10px; font-size: 0.9em; opacity: 0.9; }
        .games-list {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .game-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .game-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .game-id { font-weight: bold; color: #2d3748; }
        .game-stats { margin-top: 8px; color: #718096; font-size: 0.9em; }
        .replay-viewer {
            display: none;
            margin-top: 20px;
        }
        .board-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .player-area {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
        }
        .mandala-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .mandala {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin: 15px 0 20px 0;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary {
            background: #718096;
            color: white;
        }
        .move-info {
            text-align: center;
            font-size: 1.1em;
            margin: 10px 0;
        }
        .card-display {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .card { font-size: 1.5em; }
        .back-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" style="color: white; text-decoration: none; opacity: 0.7; font-size: 0.4em;">&#8592; All Games</a>
            <br>🎬 MANDALA TRAINING REPLAYS
        </div>

        <div id="iterationView" class="card">
            <h2 style="margin-bottom: 20px;">Select Training Iteration</h2>
            <div id="iterationsList" class="iterations-grid"></div>
        </div>

        <div id="gamesView" class="card" style="display: none;">
            <button class="btn btn-secondary back-btn" onclick="showIterations()">← Back to Iterations</button>
            <h2 id="gamesTitle">Games</h2>
            <div id="gamesList" class="games-list"></div>
        </div>

        <div id="replayView" class="card" style="display: none;">
            <button class="btn btn-secondary back-btn" onclick="showGames()">← Back to Games</button>
            <h2 id="replayTitle">Replay</h2>

            <div class="move-info">
                <strong>Move <span id="currentMove">0</span> / <span id="totalMoves">0</span></strong>
                <span id="currentAction" style="margin-left: 20px;"></span>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="firstMove()">⏮ First</button>
                <button class="btn btn-primary" onclick="prevMove()">◀ Prev</button>
                <button class="btn btn-primary" onclick="playPause()">▶ Play</button>
                <button class="btn btn-primary" onclick="nextMove()">Next ▶</button>
                <button class="btn btn-primary" onclick="lastMove()">Last ⏭</button>
            </div>

            <div class="board-container">
                <div class="player-area">
                    <h3>Player 0</h3>
                    <div><strong>Hand:</strong></div>
                    <div class="card-display" id="hand0"></div>
                    <div style="margin-top: 10px;"><strong>River:</strong></div>
                    <div class="card-display" id="river0"></div>
                    <div style="margin-top: 10px;"><strong>Cup: <span id="cup0">0</span> cards</strong></div>
                </div>

                <div class="mandala-area">
                    <div class="mandala">
                        <h3>Mandala 0</h3>
                        <div><strong>Mountain:</strong></div>
                        <div class="card-display" id="mountain0"></div>
                        <div style="margin-top: 10px;"><strong>Field P0:</strong></div>
                        <div class="card-display" id="field0_0"></div>
                        <div><strong>Field P1:</strong></div>
                        <div class="card-display" id="field0_1"></div>
                    </div>
                    <div class="mandala">
                        <h3>Mandala 1</h3>
                        <div><strong>Mountain:</strong></div>
                        <div class="card-display" id="mountain1"></div>
                        <div style="margin-top: 10px;"><strong>Field P0:</strong></div>
                        <div class="card-display" id="field1_0"></div>
                        <div><strong>Field P1:</strong></div>
                        <div class="card-display" id="field1_1"></div>
                    </div>
                </div>

                <div class="player-area">
                    <h3>Player 1</h3>
                    <div><strong>Hand:</strong></div>
                    <div class="card-display" id="hand1"></div>
                    <div style="margin-top: 10px;"><strong>River:</strong></div>
                    <div class="card-display" id="river1"></div>
                    <div style="margin-top: 10px;"><strong>Cup: <span id="cup1">0</span> cards</strong></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentIteration = null;
        let currentReplay = null;
        let currentMoveIndex = 0;
        let playing = false;
        let playInterval = null;

        const API_BASE = '{{ api_base|default("", true) }}';
        const colorEmojis = ['🔴', '🟢', '🟣', '🟠', '🟡', '⚪'];

        async function loadIterations() {
            const response = await fetch(`${API_BASE}/api/iterations`);
            const data = await response.json();

            const container = document.getElementById('iterationsList');
            container.innerHTML = data.iterations.map(iter => `
                <div class="iter-card" onclick="loadGames('${iter.iteration}')">
                    <div class="iter-name">Iteration ${iter.iteration}</div>
                    <div class="iter-stats">
                        ${iter.game_count} games<br>
                        ${iter.total_moves} moves<br>
                        ${iter.elo ? `🏆 Elo: ${iter.elo}` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function loadGames(iteration) {
            currentIteration = iteration;
            const response = await fetch(`${API_BASE}/api/games/${iteration}`);
            const data = await response.json();

            document.getElementById('gamesTitle').textContent = `Iteration ${iteration} - ${data.games.length} Games`;
            document.getElementById('iterationView').style.display = 'none';
            document.getElementById('gamesView').style.display = 'block';

            const container = document.getElementById('gamesList');
            container.style.display = 'grid';
            container.innerHTML = data.games.map(game => {
                const winner = game.winner === 0 ? 'P0 Won' : game.winner === 1 ? 'P1 Won' : 'Draw';
                return `
                    <div class="game-card" onclick="loadReplay('${game.game_id}')">
                        <div class="game-id">Game ${game.game_id.substring(9, 15)}</div>
                        <div class="game-stats">
                            ${game.move_count} moves<br>
                            Score: ${game.score0} - ${game.score1}<br>
                            ${winner}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadReplay(gameId) {
            const response = await fetch(`${API_BASE}/api/replay/${gameId}`);
            currentReplay = await response.json();
            currentMoveIndex = 0;

            document.getElementById('replayTitle').textContent = `Game ${gameId.substring(9, 15)}`;
            document.getElementById('gamesView').style.display = 'none';
            document.getElementById('replayView').style.display = 'block';

            document.getElementById('totalMoves').textContent = currentReplay.moves.length;
            showMove(0);
        }

        function showMove(index) {
            if (!currentReplay || index < 0 || index >= currentReplay.moves.length) return;

            currentMoveIndex = index;
            const move = currentReplay.moves[index];
            const state = move.state;

            document.getElementById('currentMove').textContent = move.move_num;
            document.getElementById('currentAction').textContent = move.action_desc;

            // Display hands
            displayCards('hand0', state.hands[0]);
            displayCards('hand1', state.hands[1]);

            // Display rivers
            displayCards('river0', state.rivers[0]);
            displayCards('river1', state.rivers[1]);

            // Display cups
            document.getElementById('cup0').textContent = state.cups[0];
            document.getElementById('cup1').textContent = state.cups[1];

            // Display mandalas
            for (let i = 0; i < 2; i++) {
                displayCards(`mountain${i}`, state.mountains[i]);
                displayCards(`field${i}_0`, state.fields[i][0]);
                displayCards(`field${i}_1`, state.fields[i][1]);
            }
        }

        function displayCards(elementId, cards) {
            const container = document.getElementById(elementId);
            if (!cards || cards.length === 0) {
                container.innerHTML = '<span style="color: #718096;">Empty</span>';
                return;
            }
            container.innerHTML = cards.map(color =>
                `<span class="card">${colorEmojis[color]}</span>`
            ).join('');
        }

        function firstMove() { showMove(0); }
        function lastMove() { showMove(currentReplay.moves.length - 1); }
        function nextMove() { showMove(currentMoveIndex + 1); }
        function prevMove() { showMove(currentMoveIndex - 1); }

        function playPause() {
            playing = !playing;
            if (playing) {
                playInterval = setInterval(() => {
                    if (currentMoveIndex >= currentReplay.moves.length - 1) {
                        playing = false;
                        clearInterval(playInterval);
                        return;
                    }
                    nextMove();
                }, 1000);
            } else {
                clearInterval(playInterval);
            }
        }

        function showIterations() {
            document.getElementById('gamesView').style.display = 'none';
            document.getElementById('replayView').style.display = 'none';
            document.getElementById('iterationView').style.display = 'block';
        }

        function showGames() {
            document.getElementById('replayView').style.display = 'none';
            document.getElementById('gamesView').style.display = 'block';
            if (playing) {
                playing = false;
                clearInterval(playInterval);
            }
        }

        // Load iterations on page load
        loadIterations();
    </script>
</body>
</html>
