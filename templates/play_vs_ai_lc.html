<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Cities - Play vs AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

        .header { background: #16213e; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 1.4em; color: #e94560; }
        .model-info { font-size: 0.85em; color: #888; }

        .controls { padding: 8px 20px; background: #0f3460; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em; font-weight: 600; min-height: 44px; }
        .btn-primary { background: #e94560; color: white; }
        .btn-primary:hover { background: #c73652; }
        .btn-secondary { background: #533483; color: white; }
        .btn-secondary:hover { background: #3e2563; }
        .btn-save { background: #48bb78; color: white; }
        .btn-save:hover { background: #38a169; }

        select { padding: 8px 12px; font-size: 0.9em; border: 2px solid #e94560; border-radius: 6px; background: #16213e; color: #eee; cursor: pointer; min-height: 44px; }

        .game-area { display: flex; flex-direction: column; padding: 15px; gap: 10px; max-width: 1100px; margin: 0 auto; }

        /* Player areas */
        .player-area { display: flex; gap: 15px; align-items: flex-start; }
        .player-label { writing-mode: vertical-lr; font-weight: bold; font-size: 0.9em; padding: 5px; min-width: 25px;
            background: #16213e; border-radius: 4px; text-align: center; }
        .player-label.active { background: #e94560; }

        /* Expeditions */
        .expeditions { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
        .expedition-col { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .expedition-col .color-label { font-size: 0.75em; font-weight: bold; padding: 2px 8px; border-radius: 3px; margin-bottom: 4px; }

        .card-stack { display: flex; flex-direction: column; min-height: 30px; }
        .card-stack .card { margin-top: -18px; }
        .card-stack .card:first-child { margin-top: 0; }

        /* Cards */
        .card { width: 55px; height: 38px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.85em; border: 2px solid rgba(255,255,255,0.2); cursor: default; }
        .card.wager { font-style: italic; }
        .card.clickable { cursor: pointer; border-color: #e94560; box-shadow: 0 0 8px rgba(233,69,96,0.5); }
        .card.clickable:hover { transform: scale(1.1); }
        .card.selected { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.7); transform: scale(1.1); }

        .color-0 { background: #c0392b; } /* Red */
        .color-1 { background: #27ae60; } /* Green */
        .color-2 { background: #2980b9; } /* Blue */
        .color-3 { background: #bdc3c7; color: #333; } /* White */
        .color-4 { background: #f1c40f; color: #333; } /* Yellow */

        /* Discard area */
        .discard-area { display: flex; gap: 8px; padding: 8px; background: #16213e; border-radius: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .discard-pile { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .discard-pile .label { font-size: 0.7em; color: #888; margin-top: 2px; }

        /* Hand */
        .hand-area { display: flex; gap: 6px; padding: 10px; background: #16213e; border-radius: 8px; justify-content: center; flex-wrap: wrap; }
        .hand-card { width: 65px; height: 45px; font-size: 0.95em; }

        /* Scores */
        .score-bar { display: flex; justify-content: space-around; padding: 8px; background: #16213e; border-radius: 8px; }
        .score-item { text-align: center; }
        .score-item .value { font-size: 1.3em; font-weight: bold; color: #e94560; }
        .score-item .label { font-size: 0.75em; color: #888; }

        /* Action panel */
        .action-panel { padding: 10px; background: #0f3460; border-radius: 8px; }
        .action-panel h3 { font-size: 0.9em; margin-bottom: 8px; color: #e94560; }
        .action-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
        .action-btn { text-align: left; padding: 8px 10px; background: #16213e; color: #eee; border: 1px solid #333;
            border-radius: 4px; cursor: pointer; font-size: 0.85em; min-height: 44px; }
        .action-btn:hover { background: #1a3a6e; border-color: #e94560; }

        /* Status */
        .status-bar { padding: 10px; text-align: center; font-size: 0.95em; background: #0f3460; border-radius: 8px; }
        .status-bar.thinking { color: #f1c40f; }
        .status-bar.your-turn { color: #27ae60; }
        .status-bar.game-over { color: #e94560; font-weight: bold; }

        /* Deck info */
        .deck-info { text-align: center; font-size: 0.8em; color: #888; padding: 4px; }

        /* AI decision */
        .ai-decision { padding: 8px; background: #1a3a6e; border-radius: 6px; font-size: 0.85em; margin-top: 5px; }
        .ai-decision .move { color: #f1c40f; }

        /* Game over overlay */
        .game-over-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; z-index: 1000; }
        .game-over-overlay.show { display: flex; }
        .game-over-content { background: #16213e; padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; }
        .game-over-content h2 { font-size: 1.8em; margin-bottom: 15px; }
        .game-over-content .result { font-size: 1.2em; color: #e94560; margin-bottom: 20px; }
        .go-scores-row { display: flex; justify-content: space-around; margin: 20px 0; }
        .go-score-box { text-align: center; }
        .go-score-box .player { font-size: 0.9em; color: #888; margin-bottom: 5px; }
        .go-score-box .score { font-size: 2.5em; font-weight: bold; color: #e94560; }

        /* Feedback form */
        .feedback-form { margin: 20px 0 0; text-align: left; }
        .feedback-form h3 { font-size: 0.95em; color: #888; margin-bottom: 12px; text-align: center; }
        .rating-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .rating-row .rating-label { font-size: 0.85em; color: #aaa; }
        .stars { display: flex; gap: 4px; }
        .stars span { font-size: 1.5em; cursor: pointer; color: #444; transition: color 0.15s; user-select: none; }
        .stars span.filled { color: #f1c40f; }
        .feedback-comment { width: 100%; padding: 8px; margin-top: 8px; background: #1a1a2e; color: #eee;
            border: 1px solid #333; border-radius: 6px; font-size: 0.85em; resize: vertical; min-height: 50px; font-family: inherit; }
        .feedback-comment::placeholder { color: #555; }
        .feedback-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-skip { padding: 8px 16px; background: transparent; color: #888; border: 1px solid #444; border-radius: 6px;
            cursor: pointer; font-size: 0.9em; font-weight: 600; min-height: 44px; }
        .btn-skip:hover { color: #eee; border-color: #888; }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 10px 15px; }
            .controls { padding: 8px 15px; }
            .game-area { padding: 10px; gap: 8px; }
            .expedition-col { min-width: 60px; }
            .card { width: 48px; height: 34px; font-size: 0.8em; }
            .hand-card { width: 58px; height: 40px; font-size: 0.9em; }
        }

        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls .btn, .controls select { width: 100%; }
            .expedition-col { min-width: 50px; }
            .card { width: 42px; height: 30px; font-size: 0.75em; }
            .hand-card { width: 50px; height: 36px; font-size: 0.85em; }
            .player-area { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lost Cities</h1>
        <div class="model-info" id="modelInfo">Loading...</div>
    </div>

    <div class="controls">
        <select id="checkpointSelect" onchange="reloadWithCheckpoint()">
            <option value="">Loading checkpoints...</option>
        </select>
        <button class="btn btn-primary" onclick="newGame(0)">New Game (You First)</button>
        <button class="btn btn-secondary" onclick="newGame(1)">New Game (AI First)</button>
        <button class="btn btn-save" onclick="saveGame()">Save Game</button>
        <span class="deck-info" id="deckInfo"></span>
    </div>

    <div class="game-area">
        <!-- Opponent expeditions -->
        <div class="player-area">
            <div class="player-label" id="oppLabel">AI</div>
            <div class="expeditions" id="oppExpeditions"></div>
        </div>

        <!-- Discard piles + Deck -->
        <div class="discard-area" id="discardArea"></div>

        <!-- Your expeditions -->
        <div class="player-area">
            <div class="player-label" id="yourLabel">You</div>
            <div class="expeditions" id="yourExpeditions"></div>
        </div>

        <!-- Score bar -->
        <div class="score-bar" id="scoreBar"></div>

        <!-- Your hand -->
        <div class="hand-area" id="handArea"></div>

        <!-- Status -->
        <div class="status-bar" id="statusBar">Click "New Game" to start</div>

        <!-- AI decision info -->
        <div class="ai-decision" id="aiDecision" style="display:none"></div>
        <div id="aiDecisionNote" style="display:none; font-size:0.7em; color:#888; margin-top:2px">Percentages show raw network policy (no MCTS search)</div>

        <!-- Action list (for complex moves) -->
        <div class="action-panel" id="actionPanel" style="display:none">
            <h3 id="actionTitle">Choose action:</h3>
            <div class="action-list" id="actionList"></div>
        </div>
    </div>

    <!-- Game over -->
    <div class="game-over-overlay" id="gameOver">
        <div class="game-over-content">
            <h2 id="gameOverTitle">Game Over</h2>
            <div class="result" id="winnerText"></div>
            <div class="go-scores-row">
                <div class="go-score-box"><div class="player">You</div><div class="score" id="finalScoreYou">0</div></div>
                <div class="go-score-box"><div class="player">AI</div><div class="score" id="finalScoreAI">0</div></div>
            </div>
            <div class="feedback-form">
                <h3>Rate this game (optional)</h3>
                <div class="rating-row">
                    <span class="rating-label">Your play</span>
                    <div class="stars" id="starsMyPlay"></div>
                </div>
                <div class="rating-row">
                    <span class="rating-label">Bot's play</span>
                    <div class="stars" id="starsBotPlay"></div>
                </div>
                <textarea class="feedback-comment" id="feedbackComment" placeholder="Any comments?" maxlength="500"></textarea>
                <div class="feedback-actions">
                    <button class="btn-skip" onclick="closeGameOver()">Skip</button>
                    <button class="btn btn-primary" onclick="submitFeedback()">Submit & Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = '{{ base_url }}';
        let gameState = null;
        let selectedCard = null;
        let turnStartTime = null;
        let gameId = null;
        const COLORS = ['Red', 'Green', 'Blue', 'White', 'Yellow'];

        async function newGame(humanPlayer) {
            const resp = await fetch(`${BASE_URL}/api/new_game`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({human_player: humanPlayer})
            });
            gameState = await resp.json();
            gameId = gameState.game_id;
            selectedCard = null;
            turnStartTime = null;
            gameOverShown = false;
            document.getElementById('aiDecision').style.display = 'none';
            document.getElementById('aiDecisionNote').style.display = 'none';
            renderGame();
            checkAiTurn();
        }

        function renderGame() {
            if (!gameState) return;
            const s = gameState.state;
            const hp = gameState.human_player;
            const opp = 1 - hp;

            // Model info
            const mi = gameState.model_info;
            document.getElementById('modelInfo').textContent =
                `Iter ${mi.iteration} | ${mi.total_games} games | ${mi.checkpoint}`;

            // Deck info
            document.getElementById('deckInfo').textContent =
                `Deck: ${s.deck_size} | Turn: ${s.turns_played}`;

            // Scores
            document.getElementById('scoreBar').innerHTML = `
                <div class="score-item"><div class="value">${s.scores['player' + hp]}</div><div class="label">You</div></div>
                <div class="score-item"><div class="value">${s.scores['player' + opp]}</div><div class="label">AI</div></div>
            `;

            // Player labels
            const yourActive = gameState.current_player === hp && !gameState.is_terminal;
            const oppActive = gameState.current_player === opp && !gameState.is_terminal;
            document.getElementById('yourLabel').className = 'player-label' + (yourActive ? ' active' : '');
            document.getElementById('oppLabel').className = 'player-label' + (oppActive ? ' active' : '');

            // Render expeditions
            renderExpeditions('yourExpeditions', s.expeditions['player' + hp]);
            renderExpeditions('oppExpeditions', s.expeditions['player' + opp]);

            // Render discard piles
            renderDiscardPiles(s.discard_piles);

            // Render hand
            renderHand(s.hands['player' + hp], hp);

            // Track think time
            if (yourActive) {
                if (!turnStartTime) turnStartTime = Date.now();
            }

            // Status
            updateStatus();
        }

        function renderExpeditions(containerId, expeditions) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let c = 0; c < 5; c++) {
                const col = document.createElement('div');
                col.className = 'expedition-col';

                const label = document.createElement('div');
                label.className = 'color-label color-' + c;
                label.textContent = COLORS[c];
                col.appendChild(label);

                const stack = document.createElement('div');
                stack.className = 'card-stack';

                const exp = expeditions[COLORS[c].toLowerCase()];
                if (exp && exp.cards) {
                    exp.cards.forEach(card => {
                        const el = document.createElement('div');
                        el.className = `card color-${card.color}${card.value === 0 ? ' wager' : ''}`;
                        el.textContent = card.value === 0 ? 'W' : card.value;
                        stack.appendChild(el);
                    });
                }
                col.appendChild(stack);
                container.appendChild(col);
            }
        }

        function renderDiscardPiles(piles) {
            const container = document.getElementById('discardArea');
            container.innerHTML = '<span style="font-size:0.8em;color:#888;">Discard:</span>';
            for (let c = 0; c < 5; c++) {
                const pile = document.createElement('div');
                pile.className = 'discard-pile';

                const colorName = COLORS[c].toLowerCase();
                const cards = piles[colorName] || [];
                if (cards.length > 0) {
                    const top = cards[cards.length - 1];
                    const el = document.createElement('div');
                    el.className = `card color-${top.color}${top.value === 0 ? ' wager' : ''}`;
                    el.textContent = top.value === 0 ? 'W' : top.value;
                    pile.appendChild(el);
                } else {
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.style.background = '#333';
                    el.style.border = '2px dashed #555';
                    el.textContent = '-';
                    pile.appendChild(el);
                }

                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = `${COLORS[c]} (${cards.length})`;
                pile.appendChild(label);

                container.appendChild(pile);
            }
        }

        function renderHand(cards, player) {
            const container = document.getElementById('handArea');
            container.innerHTML = '';

            const isMyTurn = gameState.current_player === player && !gameState.is_terminal;

            cards.forEach((card, idx) => {
                const el = document.createElement('div');
                el.className = `card hand-card color-${card.color}${card.value === 0 ? ' wager' : ''}`;
                if (isMyTurn) {
                    el.classList.add('clickable');
                    if (selectedCard === idx) el.classList.add('selected');
                    el.onclick = () => selectCard(idx);
                }
                el.textContent = card.value === 0 ? 'W' : card.value;
                container.appendChild(el);
            });
        }

        function selectCard(idx) {
            if (selectedCard === idx) {
                selectedCard = null;
                document.getElementById('actionPanel').style.display = 'none';
            } else {
                selectedCard = idx;
                showActionsForCard(idx);
            }
            renderGame();
        }

        function showActionsForCard(handPos) {
            const panel = document.getElementById('actionPanel');
            const list = document.getElementById('actionList');
            const title = document.getElementById('actionTitle');
            list.innerHTML = '';

            const validMoves = gameState.valid_moves.filter(m => {
                const hp = m.action / 12 | 0;
                return hp === handPos;
            });

            if (validMoves.length === 0) {
                title.textContent = 'No valid moves for this card';
                panel.style.display = 'block';
                return;
            }

            title.textContent = 'Choose action:';
            validMoves.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.textContent = m.description;
                btn.onclick = () => makeMove(m.action);
                list.appendChild(btn);
            });

            panel.style.display = 'block';
        }

        async function makeMove(action) {
            const thinkTime = turnStartTime ? Date.now() - turnStartTime : null;
            turnStartTime = null;

            document.getElementById('statusBar').textContent = 'Making move...';
            document.getElementById('statusBar').className = 'status-bar thinking';
            document.getElementById('actionPanel').style.display = 'none';
            selectedCard = null;

            const resp = await fetch(`${BASE_URL}/api/move`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({game_id: gameId, action: action, think_time_ms: thinkTime})
            });
            gameState = await resp.json();
            renderGame();
            checkAiTurn();
        }

        async function checkAiTurn() {
            if (!gameState || gameState.is_terminal) {
                if (gameState && gameState.is_terminal) {
                    saveGame();
                    showGameOver();
                }
                return;
            }
            if (gameState.current_player !== gameState.human_player) {
                document.getElementById('statusBar').textContent = 'AI is thinking...';
                document.getElementById('statusBar').className = 'status-bar thinking';

                await new Promise(r => setTimeout(r, 500));

                const resp = await fetch(`${BASE_URL}/api/ai_move`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId})
                });
                gameState = await resp.json();

                if (gameState.ai_decision) {
                    const dec = gameState.ai_decision;
                    const decEl = document.getElementById('aiDecision');
                    decEl.style.display = 'block';
                    document.getElementById('aiDecisionNote').style.display = 'block';
                    let html = `<span class="move">AI: ${dec.description}</span>`;
                    if (dec.top_moves && dec.top_moves.length > 1) {
                        html += '<br><small>Top: ' + dec.top_moves.map(m =>
                            `${m.description} (${m.probability.toFixed(1)}%)`
                        ).join(', ') + '</small>';
                    }
                    decEl.innerHTML = html;
                }

                renderGame();
                checkAiTurn();
            }
        }

        function updateStatus() {
            const bar = document.getElementById('statusBar');
            if (gameState.is_terminal) {
                const w = gameState.winner;
                const hp = gameState.human_player;
                const s = gameState.scores;
                if (w === hp) {
                    bar.textContent = `You win! ${s.player0} - ${s.player1}`;
                } else if (w === -1) {
                    bar.textContent = `Draw! ${s.player0} - ${s.player1}`;
                } else {
                    bar.textContent = `AI wins! ${s.player0} - ${s.player1}`;
                }
                bar.className = 'status-bar game-over';
            } else if (gameState.current_player === gameState.human_player) {
                bar.textContent = 'Your turn - click a card then choose an action';
                bar.className = 'status-bar your-turn';
            } else {
                bar.textContent = 'AI is thinking...';
                bar.className = 'status-bar thinking';
            }
        }

        async function saveGame() {
            if (!gameId) return;
            try {
                await fetch(`${BASE_URL}/api/save`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId})
                });
            } catch (e) {
                console.error('Save failed:', e);
            }
        }

        async function loadCheckpoints() {
            try {
                const resp = await fetch(`${BASE_URL}/api/checkpoints`);
                const checkpoints = await resp.json();
                const select = document.getElementById('checkpointSelect');
                select.innerHTML = '<option value="">Select checkpoint...</option>';
                checkpoints.forEach(cp => {
                    const opt = document.createElement('option');
                    opt.value = cp.name;
                    opt.textContent = `${cp.name} (Iter ${cp.iteration}, ${cp.total_games} games)`;
                    if (gameState && gameState.model_info && cp.name === gameState.model_info.checkpoint) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Error loading checkpoints:', e);
            }
        }

        async function reloadWithCheckpoint() {
            const select = document.getElementById('checkpointSelect');
            if (!select.value) return;
            try {
                const resp = await fetch(`${BASE_URL}/api/load_checkpoint`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({checkpoint: select.value})
                });
                const result = await resp.json();
                if (result.success) {
                    document.getElementById('statusBar').textContent = `Loaded: Iter ${result.iteration}. Click New Game to play.`;
                    document.getElementById('statusBar').className = 'status-bar your-turn';
                    gameId = null;
                }
            } catch (e) {
                console.error('Error loading checkpoint:', e);
            }
        }

        // Game over overlay + feedback
        let myPlayRating = 0;
        let botPlayRating = 0;
        let gameOverShown = false;

        function showGameOver() {
            if (gameOverShown) return;
            gameOverShown = true;

            const w = gameState.winner;
            const hp = gameState.human_player;
            const s = gameState.scores;

            document.getElementById('finalScoreYou').textContent = s['player' + hp];
            document.getElementById('finalScoreAI').textContent = s['player' + (1 - hp)];

            if (w === hp) {
                document.getElementById('gameOverTitle').textContent = 'You Win!';
                document.getElementById('winnerText').textContent = 'You beat the AI!';
            } else if (w === -1) {
                document.getElementById('gameOverTitle').textContent = 'Draw!';
                document.getElementById('winnerText').textContent = 'The game ended in a tie.';
            } else {
                document.getElementById('gameOverTitle').textContent = 'AI Wins';
                document.getElementById('winnerText').textContent = 'Better luck next time.';
            }

            resetFeedback();
            document.getElementById('gameOver').classList.add('show');
        }

        function closeGameOver() {
            document.getElementById('gameOver').classList.remove('show');
        }

        function initStars(containerId, setter) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            let currentRating = 0;
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('span');
                star.textContent = '\u2605';
                star.dataset.value = i;
                star.onmouseenter = () => updateStars(containerId, i);
                star.onclick = () => {
                    currentRating = i;
                    setter(i);
                    updateStars(containerId, i);
                };
                container.appendChild(star);
            }
            container.onmouseleave = () => updateStars(containerId, currentRating);
        }

        function updateStars(containerId, rating) {
            const stars = document.getElementById(containerId).querySelectorAll('span');
            stars.forEach(s => {
                s.classList.toggle('filled', parseInt(s.dataset.value) <= rating);
            });
        }

        function resetFeedback() {
            myPlayRating = 0;
            botPlayRating = 0;
            initStars('starsMyPlay', v => { myPlayRating = v; });
            initStars('starsBotPlay', v => { botPlayRating = v; });
            document.getElementById('feedbackComment').value = '';
        }

        async function submitFeedback() {
            if (!gameId) { closeGameOver(); return; }
            const payload = { game_id: gameId };
            if (myPlayRating > 0) payload.my_play_rating = myPlayRating;
            if (botPlayRating > 0) payload.bot_play_rating = botPlayRating;
            const comment = document.getElementById('feedbackComment').value.trim();
            if (comment) payload.comment = comment;

            try {
                await fetch(`${BASE_URL}/api/feedback`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error('Feedback submit failed:', e);
            }
            closeGameOver();
        }

        loadCheckpoints().then(() => {
            // Show model info from loaded checkpoint (before game starts)
            const select = document.getElementById('checkpointSelect');
            if (select.options.length > 1) {
                const opt = select.options[1]; // First real checkpoint
                document.getElementById('modelInfo').textContent = opt.textContent;
            } else {
                document.getElementById('modelInfo').textContent = 'Ready — click New Game to play';
            }
        });
    </script>
</body>
</html>
