<!DOCTYPE html>
<html>
<head>
    <title>Game Replay - Mandala RL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .controls {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background: #4a9eff;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #3a8eef; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .game-board {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
        }
        .player-area {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #3a3a3a;
        }
        .player-area.active { border-color: #4a9eff; }
        .mandalas {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .mandala {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        .mandala h3 { color: #4a9eff; margin-bottom: 15px; }
        .section {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
        }
        .section-title { color: #888; font-size: 12px; margin-bottom: 5px; }
        .cards { display: flex; flex-wrap: wrap; gap: 5px; }
        .card {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            text-align: center;
            line-height: 30px;
            font-size: 18px;
        }
        .move-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3a3a3a;
        }
        .score { font-size: 24px; font-weight: bold; color: #4caf50; }
        a { color: #4a9eff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Game Replay</h1>
            <a href="/">← Back to Dashboard</a>
        </div>

        <div class="move-info">
            <div id="move-display">Loading game...</div>
        </div>

        <div class="controls">
            <button class="btn" onclick="firstMove()">⏮ First</button>
            <button class="btn" onclick="prevMove()">◀ Previous</button>
            <button class="btn" onclick="nextMove()">Next ▶</button>
            <button class="btn" onclick="lastMove()">Last ⏭</button>
            <span style="margin-left: auto; color: #888;">
                Move: <span id="current-move">0</span> / <span id="total-moves">0</span>
            </span>
        </div>

        <div class="game-board">
            <div class="player-area" id="player0-area">
                <h2>Player 0</h2>
                <div class="section">
                    <div class="section-title">Hand (<span id="p0-hand-count">0</span>)</div>
                    <div class="cards" id="p0-hand"></div>
                </div>
                <div class="section">
                    <div class="section-title">River (<span id="p0-river-count">0</span>/6)</div>
                    <div class="cards" id="p0-river"></div>
                </div>
                <div class="section">
                    <div class="section-title">Cup: <span id="p0-cup-count">0</span> cards</div>
                </div>
            </div>

            <div class="mandalas">
                <div class="mandala">
                    <h3>Mandala 0</h3>
                    <div class="section">
                        <div class="section-title">Mountain</div>
                        <div class="cards" id="m0-mountain"></div>
                    </div>
                    <div class="section">
                        <div class="section-title">Field P0</div>
                        <div class="cards" id="m0-field0"></div>
                    </div>
                    <div class="section">
                        <div class="section-title">Field P1</div>
                        <div class="cards" id="m0-field1"></div>
                    </div>
                </div>

                <div class="mandala">
                    <h3>Mandala 1</h3>
                    <div class="section">
                        <div class="section-title">Mountain</div>
                        <div class="cards" id="m1-mountain"></div>
                    </div>
                    <div class="section">
                        <div class="section-title">Field P0</div>
                        <div class="cards" id="m1-field0"></div>
                    </div>
                    <div class="section">
                        <div class="section-title">Field P1</div>
                        <div class="cards" id="m1-field1"></div>
                    </div>
                </div>
            </div>

            <div class="player-area" id="player1-area">
                <h2>Player 1</h2>
                <div class="section">
                    <div class="section-title">Hand (<span id="p1-hand-count">0</span>)</div>
                    <div class="cards" id="p1-hand"></div>
                </div>
                <div class="section">
                    <div class="section-title">River (<span id="p1-river-count">0</span>/6)</div>
                    <div class="cards" id="p1-river"></div>
                </div>
                <div class="section">
                    <div class="section-title">Cup: <span id="p1-cup-count">0</span> cards</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let gameData = null;
        let currentMoveIndex = 0;
        const colorEmojis = ['⚪', '🟢', '🟣', '🟡', '🔴', '🟠'];

        async function loadGame() {
            try {
                const game = '{{ game }}';
                const filename = '{{ filename }}';
                const response = await fetch(`/api/replay/${game}/${filename}`);
                gameData = await response.json();
                currentMoveIndex = 0;
                displayMove();
            } catch (error) {
                console.error('Error loading game:', error);
                document.getElementById('move-display').textContent = 'Error loading game';
            }
        }

        function displayMove() {
            if (!gameData || currentMoveIndex < 0 || currentMoveIndex >= gameData.moves.length) return;

            const move = gameData.moves[currentMoveIndex];
            const state = move.state;

            // Update move info
            document.getElementById('move-display').innerHTML = `
                <strong>Move ${move.move_num}</strong> - Player ${move.player}: ${move.action_desc}
            `;
            document.getElementById('current-move').textContent = currentMoveIndex + 1;
            document.getElementById('total-moves').textContent = gameData.moves.length;

            // Highlight active player
            document.getElementById('player0-area').classList.toggle('active', state.current_player === 0);
            document.getElementById('player1-area').classList.toggle('active', state.current_player === 1);

            // Display cards
            displayCards('p0-hand', state.hands[0]);
            displayCards('p1-hand', state.hands[1]);
            displayCards('p0-river', state.rivers[0]);
            displayCards('p1-river', state.rivers[1]);

            document.getElementById('p0-hand-count').textContent = state.hands[0].length;
            document.getElementById('p1-hand-count').textContent = state.hands[1].length;
            document.getElementById('p0-river-count').textContent = state.rivers[0].length;
            document.getElementById('p1-river-count').textContent = state.rivers[1].length;
            document.getElementById('p0-cup-count').textContent = state.cups[0];
            document.getElementById('p1-cup-count').textContent = state.cups[1];

            // Display mandalas
            displayCards('m0-mountain', state.mountains[0]);
            displayCards('m1-mountain', state.mountains[1]);
            displayCards('m0-field0', state.fields[0][0]);
            displayCards('m0-field1', state.fields[0][1]);
            displayCards('m1-field0', state.fields[1][0]);
            displayCards('m1-field1', state.fields[1][1]);
        }

        function displayCards(elementId, colorArray) {
            const element = document.getElementById(elementId);
            element.innerHTML = colorArray.map(color =>
                `<span class="card">${colorEmojis[color]}</span>`
            ).join('');
        }

        function firstMove() { currentMoveIndex = 0; displayMove(); }
        function lastMove() { currentMoveIndex = gameData.moves.length - 1; displayMove(); }
        function nextMove() { if (currentMoveIndex < gameData.moves.length - 1) { currentMoveIndex++; displayMove(); } }
        function prevMove() { if (currentMoveIndex > 0) { currentMoveIndex--; displayMove(); } }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevMove();
            else if (e.key === 'ArrowRight') nextMove();
            else if (e.key === 'Home') firstMove();
            else if (e.key === 'End') lastMove();
        });

        loadGame();
    </script>
</body>
</html>
