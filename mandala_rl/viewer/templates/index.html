<!DOCTYPE html>
<html>
<head>
    <title>{{ game_name }} RL Training Observer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { margin-bottom: 30px; color: #fff; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #3a3a3a;
        }
        .card h2 { margin-bottom: 15px; color: #4a9eff; font-size: 18px; }
        .stat { font-size: 32px; font-weight: bold; color: #fff; margin: 10px 0; }
        .stat-label { color: #888; font-size: 14px; }
        .replay-list { background: #2a2a2a; border-radius: 8px; padding: 20px; border: 1px solid #3a3a3a; }
        .replay-item {
            background: #333;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #444;
            cursor: pointer;
            transition: all 0.2s;
        }
        .replay-item:hover { background: #3a3a3a; border-color: #4a9eff; }
        .replay-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; color: #888; }
        .winner { color: #4caf50; font-weight: bold; }
        a { color: #4a9eff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn {
            background: #4a9eff;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn:hover { background: #3a8eef; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 {{ game_name }} RL Training Observer</h1>

        <div class="dashboard">
            <div class="card">
                <h2>📊 Training Status</h2>
                <div class="stat" id="num-checkpoints">--</div>
                <div class="stat-label">Checkpoints Saved</div>
                <div style="margin-top: 15px; color: #aaa;" id="latest-checkpoint">Loading...</div>
            </div>

            <div class="card">
                <h2>🎲 Game Replays</h2>
                <div class="stat" id="num-replays">--</div>
                <div class="stat-label">Games Recorded</div>
                <a href="#" class="btn" onclick="loadReplays(); return false;">Refresh List</a>
            </div>

            <div class="card">
                <h2>📈 Tensorboard</h2>
                <div style="margin-top: 15px;">
                    <a href="http://localhost:6006" target="_blank" class="btn">Open Tensorboard</a>
                </div>
                <div style="margin-top: 15px; color: #888; font-size: 14px;">
                    View training metrics, loss curves, and more
                </div>
            </div>
        </div>

        <div class="replay-list">
            <h2 style="margin-bottom: 20px; color: #4a9eff;">Recent Game Replays</h2>
            <div id="replays-container">Loading replays...</div>
        </div>
    </div>

    <script>
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                document.getElementById('num-checkpoints').textContent = data.num_checkpoints;
                document.getElementById('num-replays').textContent = data.num_replays;
                document.getElementById('latest-checkpoint').textContent =
                    data.latest_checkpoint ? `Latest: ${data.latest_checkpoint}` : 'No checkpoints yet';
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function loadReplays() {
            try {
                const response = await fetch('/api/replays');
                const replays = await response.json();

                const container = document.getElementById('replays-container');

                if (replays.length === 0) {
                    container.innerHTML = '<div style="color: #888;">No replays available yet. Start training to generate game replays!</div>';
                    return;
                }

                container.innerHTML = replays.map(replay => `
                    <div class="replay-item" onclick="window.location='/replay/${replay.filename}'">
                        <div style="font-weight: bold; font-size: 16px;">Game ${replay.game_id}</div>
                        <div class="replay-meta">
                            <span>${replay.num_moves} moves</span>
                            <span>Score: ${replay.final_score ? replay.final_score.join(' - ') : 'N/A'}</span>
                            <span class="winner">${replay.winner !== null ? `Player ${replay.winner} Won` : 'In Progress'}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading replays:', error);
                document.getElementById('replays-container').innerHTML =
                    '<div style="color: #f44336;">Error loading replays</div>';
            }
        }

        // Auto-refresh every 5 seconds
        setInterval(() => {
            loadStatus();
            loadReplays();
        }, 5000);

        // Initial load
        loadStatus();
        loadReplays();
    </script>
</body>
</html>
